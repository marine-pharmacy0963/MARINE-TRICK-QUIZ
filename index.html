<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>薬局なるほど！クイズ</title><link rel="stylesheet" href="style.css"></head><body><main class="shell">
<section id="home" class="card"><span id="count" class="badge">読み込み中…</span><h1>薬局なるほど！クイズ</h1><p class="sub">カテゴリを選んで、好きな遊び方で挑戦！</p><div id="categories" class="grid"></div><p class="note">一般的な情報提供・学習を目的としたクイズです。個別の治療や服薬については医師・薬剤師などにご相談ください。</p></section>
<section id="mode" class="card hidden"><span id="total" class="badge"></span><h1 id="modeCat"></h1><p class="sub">遊び方を選んでください。</p><div class="modeStack"><button class="btn bigmode" onclick="startRandom()">🎲 ランダム5問<br><small>毎回ちがう5問に挑戦</small></button><button class="btn bigmode secondary" onclick="startSeq(false)">📖 最初から順番に<br><small>1問目から全問制覇へ</small></button><button id="continueBtn" class="btn bigmode continue hidden" onclick="startSeq(true)">▶ 続きから</button></div><button class="textBtn" onclick="resetProgress()">順番モードの進捗をリセット</button><button class="textBtn" onclick="home()">← カテゴリ選択へ戻る</button></section>
<section id="quiz" class="card hidden"><div class="meta"><span id="cat"></span><span id="theme"></span></div><span id="modeLabel" class="badge"></span><div class="progress"><div id="bar"></div></div><div id="num" class="sub"></div><h1 id="question"></h1><div id="choices"></div><div id="feedback" class="feedback hidden"></div><button id="next" class="btn hidden" onclick="next()">次の問題へ →</button><button class="textBtn" onclick="backMode()">← モード選択へ</button></section>
<section id="result" class="card hidden"><span class="badge">結果発表</span><h1>おつかれさまでした！</h1><div id="finalScore" class="score"></div><p id="resultText" class="sub" style="text-align:center"></p><div class="modeStack"><button id="retry" class="btn" onclick="retry()">もう一度ランダム5問</button><button id="restart" class="btn hidden" onclick="restart()">最初からもう一周</button><button class="btn secondary" onclick="backMode()">遊び方を選び直す</button><button class="btn secondary" onclick="home()">カテゴリを選び直す</button></div></section>
</main><script src="app.js"></script></body></html>
