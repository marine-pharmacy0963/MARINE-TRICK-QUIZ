<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MARINE QUIZ</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(155deg,#dff6ff,#edfaff);color:#173449;font-family:system-ui,'Noto Sans JP',sans-serif}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:#ffffffed;border:1px solid #add9ec;border-radius:19px;padding:20px;margin:14px 0;box-shadow:0 5px 20px #0b668014}button{background:#1686c9;color:white;border:0;border-radius:12px;padding:12px 16px;margin:5px;cursor:pointer;font-weight:750}.muted{color:#547589;font-size:13px}.hero{max-width:100%;max-height:340px;object-fit:contain;display:block;margin:auto}.mini{width:90px;height:90px;object-fit:contain;float:right}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.tile{border:1px solid #9ad0e8;border-radius:13px;padding:14px;cursor:pointer;background:#f4fbff}.tile img{width:100%;height:140px;object-fit:contain}.choice{display:block;width:100%;text-align:left;background:#e7f5fc;color:#123;border:1px solid #a3d6ee}.choice:disabled{opacity:.75}.good{background:#258b6a;color:white}.wrong{background:#b55d5d;color:white}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav>*{flex:1}.hidden{display:none}.pill{border-radius:30px;padding:5px 10px;background:#d7f1fc}.links a{display:inline-block;margin:5px;padding:8px 12px;border-radius:10px;background:#e5f5fa;color:#0670a7;text-decoration:none}.star{color:#dca21b;font-size:28px}.point{max-width:100px;max-height:100px;float:right}.feedbackImage{display:block;max-width:min(100%,420px);max-height:320px;object-fit:contain;margin:14px auto;border-radius:12px}h1,h2{color:#086b9e}.siteLogo{display:block;max-width:min(100%,720px);max-height:190px;object-fit:contain;margin:0 auto 12px}.wrap{position:relative;z-index:1}body{background-position:center;background-size:cover;background-attachment:fixed}body:before{content:'';position:fixed;inset:0;background:#e9f7ffb8;pointer-events:none}</style></head><body><main class="wrap"><div id="root"></div></main><script src="quiz-data.js"></script><script>
const D=window.QUIZ_DATA,root=document.getElementById('root'),SAVE='marine_quiz_scores_v2',PROGRESS='marine_quiz_progress_v2';let selected=null,course=null,qs=[],pos=0,score=0,answered=false,usedPoints=[];const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const path=k=>D.assets[k]||'',pic=(k,cls='hero')=>path(k)?'<img class="'+cls+'" loading="lazy" src="'+E(path(k))+'">':'';function setBackground(key){let p=path(key);if(p){document.body.style.backgroundImage='url('+JSON.stringify(p)+')';return}document.body.style.backgroundImage='';if(!D.backgroundImage&&D.themeUrl){fetch(D.themeUrl).then(r=>r.ok?r.json():null).then(t=>{if(!t||selected?.backgroundImage)return;let bg=t.backgroundImage||t.background||t.bgImage||'';if(bg&&/^(https?:|data:image\/|\.\.?\/|[\w-])/.test(bg))document.body.style.backgroundImage='url('+JSON.stringify(bg)+')'}).catch(()=>{})}}function logo(){return pic(D.logoImage,'siteLogo')}function scores(){try{return JSON.parse(localStorage.getItem(SAVE)||'{}')}catch{return{}}}function putScores(x){localStorage.setItem(SAVE,JSON.stringify(x))}function menu(){selected=null;course=null;setBackground(D.backgroundImage);let s=scores();root.innerHTML='<div class="card">'+logo()+'<h1>'+E(D.title)+'</h1><p>キャラクターを選んで挑戦しよう！</p><label>並び替え <select id="sort"><option value="registered">登録順</option><option value="nameAsc">名前順 ↑</option><option value="nameDesc">名前順 ↓</option><option value="reached">到達順（プレイ済み優先）</option></select></label></div><div id="tiles" class="tiles"></div>';let sort=document.getElementById('sort');sort.value=localStorage.getItem('marine_quiz_sort')||'registered';function tiles(){let a=[...D.characters];if(sort.value==='nameAsc')a.sort((x,y)=>x.name.localeCompare(y.name,'ja'));if(sort.value==='nameDesc')a.sort((x,y)=>y.name.localeCompare(x.name,'ja'));if(sort.value==='reached')a.sort((x,y)=>Math.max(...y.courses.map(c=>s[c.id]?.last||0),0)-Math.max(...x.courses.map(c=>s[c.id]?.last||0),0));document.getElementById('tiles').innerHTML=a.map(c=>'<div class="tile" data-char="'+E(c.id)+'">'+pic(c.topImage,'hero')+'<h3>'+E(c.name)+'</h3><small>'+E(c.intro)+'</small></div>').join('');document.querySelectorAll('[data-char]').forEach(b=>b.onclick=()=>selectChar(b.dataset.char))}sort.onchange=()=>{localStorage.setItem('marine_quiz_sort',sort.value);tiles()};tiles()}
function selectChar(id){selected=D.characters.find(c=>c.id===id);if(!selected)return;setBackground(selected.backgroundImage||D.backgroundImage);let s=scores();root.innerHTML='<div class="card"><button id="back">← キャラクター一覧</button><h1>'+E(selected.name)+'</h1>'+pic(selected.topImage)+'<p>'+E(selected.intro)+'</p></div><div class="tiles">'+selected.courses.map(c=>'<div class="tile" data-course="'+E(c.id)+'">'+pic(c.selectImage,'hero')+'<h3>'+E(c.title)+'</h3><p>'+(c.scene?'<b>シチュエーション</b><br>'+E(c.scene):'')+(c.intro?(c.scene?'<br>':'')+'<b>導入セリフ</b><br>'+E(c.intro):'')+'</p><p class="muted">最高記録 '+(s[c.id]?.best===undefined?'未挑戦':s[c.id].best+'問正解')+'</p></div>').join('')+'</div>';document.getElementById('back').onclick=menu;document.querySelectorAll('[data-course]').forEach(b=>b.onclick=()=>selectCourse(b.dataset.course))}
function selectCourse(id){course=selected.courses.find(c=>c.id===id);if(!course)return;setBackground(selected.backgroundImage||D.backgroundImage);root.innerHTML='<div class="card"><button id="back">← コース選択</button><h1>'+E(course.title)+'</h1>'+pic(course.selectImage)+'<p>'+(course.scene?'<b>シチュエーション</b><br>'+E(course.scene):'')+(course.intro?(course.scene?'<br>':'')+'<b>導入セリフ</b><br>'+E(course.intro):'')+'</p><p>'+course.questions.length+'問登録</p><button id="start">挑戦する</button></div>';document.getElementById('back').onclick=()=>selectChar(selected.id);document.getElementById('start').onclick=start}
function start(){qs=course.questions.slice(0,Math.min(D.count||5,course.questions.length));if(!qs.length){alert('問題がありません');return}pos=0;score=0;usedPoints=[];showQ()}
function pointFor(q){if(q.image)return q.image;if(!course.pointImages.length)return '';let a=course.pointImages.filter(Boolean),n=a.filter(k=>!usedPoints.includes(k));if(!n.length){usedPoints=[];n=a}let key=n[Math.floor(Math.random()*n.length)];usedPoints.push(key);return key}
function showQ(){if(pos>=qs.length){result();return}let q=qs[pos],im=pointFor(q);root.innerHTML='<div class="card"><div class="muted">'+E(selected.name)+' / '+E(course.title)+'　Q'+(pos+1)+' / '+qs.length+'　正解 '+score+'</div>'+pic(im,'point')+'<h2>'+E(q.question)+'</h2>'+q.options.map((o,i)=>'<button class="choice" data-answer="'+i+'">'+E(o)+'</button>').join('')+'<div id="feedback"></div></div>';document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(+b.dataset.answer,q))}
function answer(n,q){let ok=n===Number(q.answer);if(ok)score++;document.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;if(+b.dataset.answer===Number(q.answer))b.classList.add('good');else if(+b.dataset.answer===n)b.classList.add('wrong')});document.getElementById('feedback').innerHTML='<h3>'+(ok?'正解！':'残念！')+'</h3><p>'+E(q.explanation)+'</p>'+pic((ok?q.correctImage:q.incorrectImage)||(ok?course.correctImage:course.incorrectImage)||(ok?D.defaultCorrectImage:D.defaultIncorrectImage),'feedbackImage')+'<button id="next">'+(pos===qs.length-1?'結果を見る':'次の問題')+'</button>';document.getElementById('next').onclick=()=>{pos++;showQ()}}
 function links(qs){
 const parse=(field)=>[...new Map(qs.flatMap(q=>String(q[field]||'').split(/[,、\n]/).map(v=>v.trim()).filter(Boolean)).map(raw=>{let [id,...rest]=raw.split('|');return [id.trim(),{id:id.trim(),label:rest.join('|').trim()||id.trim()}]})).values()];
 const render=(items,base)=>items.map(item=>{let id=item.id,label=item.label,url='';if(/^https?:\/\//i.test(id))url=id;else if(base){try{let u=new URL(base,location.href);u.searchParams.set('open',id);url=u.href}catch{}}return url?'<a target="_blank" rel="noopener noreferrer" href="'+E(url)+'">'+E(label)+'</a>':'<span class="pill" title="公開URL未設定">'+E(label)+'</span>'}).join('');
 let terms=parse('terms'),cols=parse('columns');return (terms.length?'<h3>気になる用語</h3><div class="links">'+render(terms,D.glossaryUrl)+'</div>':'')+(cols.length?'<h3>関連コラム</h3><div class="links">'+render(cols,D.columnUrl)+'</div>':'');
 }function result(){let tier=score===qs.length?2:score>=Math.ceil(qs.length*.6)?1:0,key=course.endImages[tier],s=scores(),old=s[course.id]||{},best=Math.max(old.best||0,score);s[course.id]={best,last:Date.now(),total:qs.length};putScores(s);root.innerHTML='<div class="card"><h1>結果発表！</h1><div class="star">'+('★'.repeat(tier+1)+'☆'.repeat(2-tier))+'</div><h2>'+score+' / '+qs.length+'問正解</h2>'+pic(key)+'<h2>'+E(course.endTexts[tier])+'</h2><p class="muted">ベスト '+best+'問</p><div class="nav"><button id="retry">もう一度</button><button id="choose">コース選択へ</button></div></div><div class="card"><h2>もっと知りたい？</h2>'+links(qs)+'</div>';document.getElementById('retry').onclick=start;document.getElementById('choose').onclick=()=>selectChar(selected.id)}menu();</script></body></html>
