<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>🧠 MARINE QUIZ MASTER</title><style>
*{box-sizing:border-box} :root{--a:#1686c9;--a2:#0878bd;--line:#9bd6f4;--panel:rgba(255,255,255,.94);--soft:#eef9ff}
body{margin:0;min-height:100vh;background:#eaf7ff center/cover fixed no-repeat;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#123}
body:before{content:"";position:fixed;inset:0;background:rgba(234,247,255,.35);z-index:-1}
main{max-width:1080px;margin:auto;padding:14px}h1{color:var(--a2)}h2{margin-top:4px}
.box,.item{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:14px;margin:11px 0;backdrop-filter:blur(5px)}
.item{border-width:1px}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:150px}
input,textarea,select{width:100%;padding:9px;margin:4px 0;border:1px solid var(--line);border-radius:8px;background:white}textarea{min-height:72px;resize:vertical}
button,.filebtn{display:inline-block;border:0;border-radius:9px;padding:9px 11px;margin:3px;background:var(--a);color:white;font-weight:800;cursor:pointer}
button:active,.filebtn:active{transform:translateY(1px)}.danger{background:#b94b4b}.secondary{background:#607d8b}.good{background:#278a62}
.small{font-size:11px;color:#567;line-height:1.6}.status{font-size:12px;font-weight:800;color:#176a4d}.top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.top b{flex:1}
.thumb{width:90px;height:90px;object-fit:contain;background:var(--soft);border-radius:12px}.hidden{display:none!important}
#lock{position:fixed;inset:0;z-index:9999;background:linear-gradient(160deg,#dff4ff,#8bd2f5);display:flex;align-items:center;justify-content:center;padding:20px}
#lock>div{width:min(430px,100%);background:#fff;border:2px solid #79c8ef;border-radius:22px;padding:22px;box-shadow:0 18px 55px #1678a533}
details{border-top:1px solid #def;padding-top:8px;margin-top:8px}summary{cursor:pointer;font-weight:800}
</style></head><body>
<div id="lock"><div><h2>🔐 🧠 MARINE QUIZ MASTER</h2><div class="small">管理パスワードを入力してください。</div><input id="pw" type="password" inputmode="numeric"><button id="loginBtn">管理画面を開く</button><div id="loginMsg" class="small"></div></div></div>
<main id="app" class="hidden"><h1>🧠 MARINE QUIZ MASTER</h1><div class="small">問題の追加・改編・並び替え・画像差し替え対応 <span id="status" class="status"></span></div>
<div class="box"><h2>🌊 ホーム背景同期</h2><div class="small">同じ場所の marine-theme.json を自動読込。必要なら手動でも読み込めます。</div><label class="filebtn">marine-theme.json を選択<input id="themeFile" type="file" accept=".json" hidden></label><div id="themeMsg" class="small"></div></div>

<div class="box"><h2>💾 保存・バックアップ</h2><button id="saveNow" class="good">今すぐ保存</button><button id="backup">MASTERバックアップ</button><label class="filebtn">バックアップ読込<input id="restore" type="file" accept=".json" hidden></label></div>
<div class="box"><h2>⚙️ クイズ設定</h2><div class="row"><label>タイトル<input id="title"></label><label>1回の出題数<input id="count" type="number" min="1" value="5"></label><label>出題順<select id="mode"><option value="random">ランダム</option><option value="order">登録順</option></select></label></div></div>
<div class="box"><h2>🧠 問題</h2><div id="list"></div><button id="add">＋ 問題追加</button></div>
<div class="box"><h2>📦 実装用書き出し</h2>
<div class="small">原案JSONだけでなく、そのままGitHub Pagesへ置ける公開用 index.html も書き出します。公開版にはMASTERの絵文字UIは入りません。</div>
<button id="export">quiz-data.json</button><button id="exportIndex" class="good">公開用 index.html を書き出す</button></div>
</main><script>const STORAGE="marine_quiz_master_v1",THEMEKEY="marine_theme_cache_v1";
let data={title:"MARINE QUIZ",count:5,mode:"random",items:[]},timer;
function state(){data.title=$("title").value;data.count=+$("count").value||5;data.mode=$("mode").value;return{schema:"marine-quiz-master-v1",updated:new Date().toISOString(),...data}}
function save(show=false){try{localStorage.setItem(STORAGE,JSON.stringify(state()));if(show){$("status").textContent="保存しました ✓";setTimeout(()=>$("status").textContent="",1500)}}catch(e){alert("保存容量を超えた可能性があります。バックアップも利用してください。")}}
function autos(){clearTimeout(timer);timer=setTimeout(()=>save(),300)}
function load(){try{let x=JSON.parse(localStorage.getItem(STORAGE)||"null");if(x)data=x}catch(e){};$("title").value=data.title||"";$("count").value=data.count||5;$("mode").value=data.mode||"random";render()}
function render(){$("list").innerHTML="";data.items.forEach((q,i)=>{let d=document.createElement("div");d.className="item";d.innerHTML=`<div class="top">${q.image?`<img class="thumb" src="${q.image}">`:""}<b>Q${i+1} ${esc(q.question||"未入力")}</b><button data-up="${i}">↑</button><button data-down="${i}">↓</button><button class="danger" data-del="${i}">削除</button></div><details open><summary>編集</summary><div class="row"><label>カテゴリ<input data-i="${i}" data-k="category" value="${esc(q.category)}"></label><label>難易度<select data-i="${i}" data-k="difficulty"><option ${q.difficulty=="やさしい"?"selected":""}>やさしい</option><option ${q.difficulty=="ふつう"?"selected":""}>ふつう</option><option ${q.difficulty=="むずかしい"?"selected":""}>むずかしい</option></select></label></div><label>問題文<textarea data-i="${i}" data-k="question">${esc(q.question)}</textarea></label><div class="row">${[0,1,2,3].map(n=>`<label>選択肢${n+1}<input data-opt="${i}:${n}" value="${esc(q.options[n]||"")}"></label>`).join("")}</div><label>正解<select data-i="${i}" data-k="answer">${[0,1,2,3].map(n=>`<option value="${n}" ${q.answer==n?"selected":""}>選択肢${n+1}</option>`).join("")}</select></label><label>解説<textarea data-i="${i}" data-k="explanation">${esc(q.explanation)}</textarea></label><label>問題画像<input type="file" accept="image/*" data-img="${i}"></label></details>`;$("list").appendChild(d)})}
$("list").oninput=e=>{if(e.target.dataset.i!==undefined){data.items[+e.target.dataset.i][e.target.dataset.k]=e.target.value;autos()}if(e.target.dataset.opt){let [i,n]=e.target.dataset.opt.split(":");data.items[+i].options[+n]=e.target.value;autos()}}
$("list").onchange=e=>{if(e.target.dataset.img!==undefined)readImg(e.target.files[0],s=>{data.items[+e.target.dataset.img].image=s;render();save()})}
$("list").onclick=e=>{let i;if(e.target.dataset.up!==undefined){i=+e.target.dataset.up;if(i>0)[data.items[i-1],data.items[i]]=[data.items[i],data.items[i-1]];render();autos()}if(e.target.dataset.down!==undefined){i=+e.target.dataset.down;if(i<data.items.length-1)[data.items[i+1],data.items[i]]=[data.items[i],data.items[i+1]];render();autos()}if(e.target.dataset.del!==undefined&&confirm("削除しますか？")){data.items.splice(+e.target.dataset.del,1);render();autos()}}
$("add").onclick=()=>{data.items.push({id:uid("quiz"),category:"健康",difficulty:"ふつう",question:"",options:["","","",""],answer:0,explanation:"",image:""});render();autos()}
for(let id of ["title","count","mode"])$(id).oninput=autos;
$("saveNow").onclick=()=>save(true);$("backup").onclick=()=>dl("marine-quiz-master-backup.json",JSON.stringify(state(),null,2));$("export").onclick=()=>dl("quiz-data.json",JSON.stringify(state(),null,2));
$("restore").onchange=e=>{let r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);save();load()}catch(_){alert("読込失敗")}};r.readAsText(e.target.files[0])}


function publicThemeScript(){
return `<script>
(function(){
 const THEMEKEY="marine_theme_cache_v1";
 function find(o){let st=[o],seen=new Set();while(st.length){let x=st.pop();if(!x||typeof x!=="object"||seen.has(x))continue;seen.add(x);for(let [k,v] of Object.entries(x)){if(typeof v==="string"&&/background|image|bg/i.test(k)&&(v.startsWith("data:image/")||v.startsWith("http")||v.startsWith("./")||v.startsWith("../")))return v;if(v&&typeof v==="object")st.push(v)}}return""}
 function apply(t){let im=find(t);if(im)document.body.style.backgroundImage='url("'+im.replace(/"/g,"%22")+'")'}
 fetch("marine-theme.json",{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject()).then(t=>{try{localStorage.setItem(THEMEKEY,JSON.stringify(t))}catch(e){};apply(t)}).catch(()=>{try{let s=localStorage.getItem(THEMEKEY);if(s)apply(JSON.parse(s))}catch(e){}})
})();<\/script>`;
}
function publicCss(){
return `*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#eaf7ff center/cover fixed no-repeat;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#123}body:before{content:"";position:fixed;inset:0;background:rgba(234,247,255,.42);z-index:-1}.wrap{max-width:850px;margin:auto;padding:18px}.card{background:rgba(255,255,255,.94);border:2px solid #9bd6f4;border-radius:20px;padding:18px;margin:12px 0;backdrop-filter:blur(6px)}h1{color:#0878bd;margin-bottom:8px}button{border:0;border-radius:11px;padding:11px 14px;margin:5px;background:#1686c9;color:white;font-weight:800;cursor:pointer}.muted{color:#567;font-size:12px}.choice{display:block;width:100%;text-align:left}.good{background:#278a62}.bad{background:#b94b4b}.img{max-width:100%;max-height:300px;object-fit:contain;border-radius:14px}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.bar>*{flex:1}.hidden{display:none!important}`;
}

function makeQuizIndex(){
 const d=state(), payload=JSON.stringify(d).replace(/</g,"\\u003c");
 return `<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(d.title||"MARINE QUIZ")}</title><style>${publicCss()}</style></head><body><div class="wrap"><div class="card"><h1 id="t"></h1><div id="meta" class="muted"></div></div><div id="game" class="card"></div><div class="card"><button id="restart">最初から</button><span id="saved" class="muted"></span></div></div>${publicThemeScript()}<script>
const DATA=${payload}, SAVE="marine_quiz_public_save_v1"; let order=[],pos=0,score=0;
const $=x=>document.getElementById(x),E=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function setup(fresh=false){if(!fresh){try{let z=JSON.parse(localStorage.getItem(SAVE)||"null");if(z&&Array.isArray(z.order)){order=z.order;pos=z.pos||0;score=z.score||0;return}}catch(e){}}
order=DATA.items.map((_,i)=>i);if(DATA.mode==="random")order.sort(()=>Math.random()-.5);order=order.slice(0,Math.min(DATA.count||5,order.length));pos=0;score=0;save()}
function save(){localStorage.setItem(SAVE,JSON.stringify({order,pos,score}));$("saved").textContent="進行状況を保存済み"}
function render(){ $("t").textContent=DATA.title||"MARINE QUIZ";$("meta").textContent="問題 "+Math.min(pos+1,order.length)+" / "+order.length+"　正解 "+score;
 if(!order.length){$("game").innerHTML="<b>問題が登録されていません。</b>";return}
 if(pos>=order.length){$("game").innerHTML="<h2>結果</h2><p>"+score+" / "+order.length+" 問正解</p><button onclick='setup(true);render()'>もう一度</button>";save();return}
 let q=DATA.items[order[pos]];$("game").innerHTML=(q.image?'<img class="img" src="'+q.image+'">':"")+"<h2>"+E(q.question)+"</h2>"+q.options.map((x,i)=>'<button class="choice" data-a="'+i+'">'+E(x)+'</button>').join("")+'<div id="fb"></div>';
 document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>answer(+b.dataset.a,q))}
function answer(a,q){document.querySelectorAll("[data-a]").forEach(x=>x.disabled=true);let ok=a==+q.answer;if(ok)score++;$("fb").innerHTML="<p><b>"+(ok?"正解！":"残念！")+"</b></p><p>"+E(q.explanation||"")+"</p><button id='next'>次へ</button>";pos++;save();$("next").onclick=render}
$("restart").onclick=()=>{if(confirm("保存中の進行状況をリセットしますか？")){localStorage.removeItem(SAVE);setup(true);render()}};setup();render();
<\/script></body></html>`;
}
$("exportIndex").onclick=()=>dl("index.html",makeQuizIndex(),"text/html;charset=utf-8");

const PW="3103", $=id=>document.getElementById(id);
function dl(n,t,type="application/json;charset=utf-8"){let b=new Blob([t],{type}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function uid(p){return p+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7)}
function readImg(file,cb){if(!file)return;let r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(file)}
function themeImage(o){let st=[o],seen=new Set();while(st.length){let x=st.pop();if(!x||typeof x!=="object"||seen.has(x))continue;seen.add(x);for(let [k,v] of Object.entries(x)){if(typeof v==="string"&&/background|image|bg/i.test(k)&&(v.startsWith("data:image/")||v.startsWith("http")||v.startsWith("./")||v.startsWith("../")))return v;if(v&&typeof v==="object")st.push(v)}}return""}
function applyTheme(t){let im=themeImage(t);if(im)document.body.style.backgroundImage=`url("${im.replace(/"/g,"%22")}")`;$("themeMsg").textContent=im?"ホーム背景を反映しました ✓":"背景画像が見つかりませんでした"}
async function autoTheme(){try{let r=await fetch("marine-theme.json",{cache:"no-store"});if(r.ok){let t=await r.json();localStorage.setItem(THEMEKEY,JSON.stringify(t));applyTheme(t);return}}catch(e){}try{let s=localStorage.getItem(THEMEKEY);if(s)applyTheme(JSON.parse(s))}catch(e){}}
$("themeFile").onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let t=JSON.parse(r.result);localStorage.setItem(THEMEKEY,JSON.stringify(t));applyTheme(t)}catch(e){alert("marine-theme.jsonを読み込めませんでした")}};r.readAsText(f);e.target.value=""}
$("loginBtn").onclick=unlock;$("pw").onkeydown=e=>{if(e.key==="Enter")unlock()};
function unlock(){if($("pw").value===PW){$("lock").classList.add("hidden");$("app").classList.remove("hidden");sessionStorage.setItem(STORAGE+"_login","1");load();autoTheme()}else $("loginMsg").textContent="パスワードが違います"}
if(sessionStorage.getItem(STORAGE+"_login")==="1"){$("lock").classList.add("hidden");$("app").classList.remove("hidden");load();autoTheme()}
</script></body></html>
